[project]
name = "rag-tr"
version = "0.1.0"
description = "Turkce dokumanlar icin kaynak gosteren RAG soru-cevap uygulamasi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "chromadb>=0.5",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "anthropic>=0.34",
    "pydantic-settings>=2.4",
    "pypdf>=4.3",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "google-genai>=1.0.0",
]

[dependency-groups]
# promptevals yalnizca degerlendirme (eval) yolunda gerekiyor; dev grubunda
# tutuluyor, Dockerfile'lar `uv sync --no-dev` kullandigi icin production
# image'ina girmiyor.
dev = ["pytest>=8.3", "promptevals"]

[tool.uv.sources]
promptevals = { path = "../LLM", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_tr"]
